<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="Rush for Ducks" />
  <link id="pwa-manifest-link" rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Rush for Ducks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Fredoka', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      font-family: var(--font-body);
      background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 55%, #86efac 100%);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1, h2, h3, .font-display {
      font-family: var(--font-display);
    }

    /* Custom Game Buttons */
    .game-btn {
      font-family: var(--font-display);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.15s ease;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25), 0 8px 16px rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
    }

    .game-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: inherit;
      pointer-events: none;
    }

    .game-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.05);
    }

    .game-btn:active:not(:disabled) {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25), 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .game-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    /* Canvas Wrapper */
    #game-frame {
      position: relative;
      width: 100%;
      max-width: 980px;
      aspect-ratio: 16 / 9;
      min-height: 360px;
      max-height: 620px;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(14, 116, 144, 0.35), 0 0 0 6px #ffffff, 0 0 0 10px #0284c7;
      background: #7dd3fc;
    }

    @media (max-width: 640px) {
      #game-frame {
        aspect-ratio: auto;
        height: 62vh;
        min-height: 340px;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(14, 116, 144, 0.35), 0 0 0 4px #ffffff;
      }
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating animations */
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .animate-bob {
      animation: floatBob 2.4s ease-in-out infinite;
    }

    /* Custom Scrollbar for modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #0284c7;
      border-radius: 9999px;
    }
  </style>
</head>
